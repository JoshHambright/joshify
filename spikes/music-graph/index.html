<title>Patchbay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Chakra+Petch:wght@300;400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* ============================================================
   One committed visual world: a neon screen. No light theme —
   a washed-out vaporwave is a contradiction. Every colour is
   painted explicitly so the page holds on any host ground.
   Two moods, both dark: NIGHT (cyan/violet) and SUNSET (magenta/orange).
   ============================================================ */
:root{
  --void:#07041a; --deep:#0d0726; --panel:#130b31; --panel-2:#1a1042; --panel-3:#221456;
  --grid:#2e1a6e; --rule:#3a2180; --rule-soft:#241452;
  --ink:#ece4ff; --ink-2:#a596dd; --ink-3:#6b5bab;
  --cyan:#00f0ff; --magenta:#ff2fb9; --violet:#a45cff; --sun:#ff8a3d;
  --canvas-bg:#07041a; --horizon-a:#00f0ff; --horizon-b:#a45cff;
  --edge-line:#7d63d8; --plate:rgba(7,4,26,.9);
  --t-person:#ff2fb9; --t-band:#ff6b3d; --t-album:#00f0ff; --t-song:#7dff5e;
  --t-studio:#a45cff; --t-instrument:#00ffc8; --t-tour:#ffd93d; --t-label:#8f86c9;
  --barh:56px;
  --display:"Bodoni Moda",Didot,"Times New Roman",serif;
  --ui:"Chakra Petch",system-ui,-apple-system,sans-serif;
  --mono:"Share Tech Mono",ui-monospace,SFMono-Regular,monospace;
}
:root[data-mood="sunset"]{
  --void:#1c0525; --deep:#280935; --panel:#310c3f; --panel-2:#3d1150; --panel-3:#4d1663;
  --grid:#7a1f74; --rule:#8c2481; --rule-soft:#4d1157;
  --ink:#ffeaf6; --ink-2:#e0a3c8; --ink-3:#a86894;
  --cyan:#ffd93d; --magenta:#ff2f7f; --violet:#ff8a3d; --sun:#ffd93d;
  --canvas-bg:#1c0525; --horizon-a:#ff8a3d; --horizon-b:#ff2f7f;
  --edge-line:#c25cb4; --plate:rgba(28,5,37,.9);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--ink);overscroll-behavior:none;
  font-family:var(--ui);font-size:13px;line-height:1.5;font-weight:400;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
::selection{background:var(--magenta);color:#fff}

/* ============ shell ============ */
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh;height:100vh;width:100%;overflow:hidden}
.deck{display:grid;grid-template-columns:252px minmax(0,1fr) 338px;min-height:0}
.rail{
  background:linear-gradient(180deg,var(--panel),var(--deep));
  border-right:1px solid var(--rule-soft);overflow-y:auto;min-height:0;
  scrollbar-color:var(--rule) transparent;scrollbar-width:thin;
}
.rail{overscroll-behavior:contain}
.rail.right{border-right:0;border-left:1px solid var(--rule-soft)}
.stage{position:relative;background:var(--canvas-bg);min-width:0;min-height:0;overflow:hidden}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.30) 0 1px,transparent 1px 3px);
  opacity:.34;
}

/* ============ top bar ============ */
.bar{
  display:flex;align-items:center;gap:16px;padding:0 16px;height:var(--barh);min-width:0;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border-bottom:1px solid var(--rule);position:relative;z-index:5;
  box-shadow:0 1px 0 var(--magenta),0 10px 34px -22px var(--magenta);
}
.mark{display:flex;align-items:baseline;gap:12px;flex:none}
.mark h1{
  margin:0;font-family:var(--display);font-weight:700;font-size:23px;
  letter-spacing:.24em;text-transform:uppercase;line-height:1;color:var(--ink);
  text-shadow:2px 0 0 rgba(255,47,185,.55),-2px 0 0 rgba(0,240,255,.5);
}
.mark h1 .jack{color:var(--magenta);text-shadow:2px 0 0 rgba(0,240,255,.35)}
.mark .sub{
  font-family:var(--mono);font-size:10px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--ink-3);
}
.qwrap{flex:1 1 auto;position:relative;min-width:0}
.qwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--cyan)}
#q{
  width:100%;height:34px;padding:0 84px 0 32px;
  background:rgba(7,4,26,.72);border:1px solid var(--rule);border-radius:0;
  font-family:var(--mono);font-size:13px;letter-spacing:.02em;color:var(--ink);
}
#q::placeholder{color:var(--ink-3)}
#q:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 1px var(--cyan),0 0 18px -4px var(--cyan)}
.qcount{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.1em;pointer-events:none;text-transform:uppercase;
}
.qcount.on{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
.barbtns{display:flex;gap:7px;flex:none}
.bbtn{
  height:34px;padding:0 13px;background:transparent;border:1px solid var(--rule);
  border-radius:0;font-family:var(--ui);font-size:11.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;
  transition:color .12s,border-color .12s,box-shadow .12s;
}
.bbtn:hover{color:var(--cyan);border-color:var(--cyan)}
.bbtn[aria-pressed="true"]{
  color:var(--void);background:var(--cyan);border-color:var(--cyan);
  box-shadow:0 0 20px -4px var(--cyan);
}
.drawerbtn{display:none}

/* ============ rail parts ============ */
.sect{border-bottom:1px solid var(--rule-soft);padding:14px 15px 16px}
.sect:last-child{border-bottom:0}
.sect h2{
  margin:0 0 10px;font-family:var(--ui);font-size:10.5px;font-weight:600;
  letter-spacing:.26em;text-transform:uppercase;color:var(--cyan);
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
}
.sect h2 .act{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);
  background:none;border:0;padding:0;cursor:pointer;text-transform:uppercase;
}
.sect h2 .act:hover{color:var(--magenta)}

.tog{display:flex;flex-direction:column;gap:1px}
.tog button{
  display:grid;grid-template-columns:9px 1fr auto;align-items:center;gap:10px;
  padding:5px 8px;background:none;border:0;border-left:2px solid transparent;
  cursor:pointer;text-align:left;color:var(--ink-3);
}
.tog button:hover{background:rgba(164,92,255,.10)}
.tog button .dot{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.22}
.tog button .nm{
  font-family:var(--ui);font-size:12.5px;font-weight:400;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);
}
.tog button .ct{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.tog button.on{border-left-color:currentColor}
.tog button.on .dot{opacity:1;box-shadow:0 0 9px currentColor}
.tog button.on .nm{color:var(--ink)}
.tog button.on .ct{color:var(--ink-2)}

.rels{display:flex;flex-direction:column;gap:1px}
.rels button{
  display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:9px;
  padding:4px 8px;background:none;border:0;cursor:pointer;text-align:left;
}
.rels button:hover{background:rgba(164,92,255,.10)}
.rels button .ln{height:0;border-top:1.5px solid var(--ink-3);opacity:.3}
.rels button.on .ln{opacity:1;border-color:var(--cyan);filter:drop-shadow(0 0 4px var(--cyan))}
.rels button .nm{
  font-family:var(--ui);font-size:11.5px;color:var(--ink-3);letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rels button.on .nm{color:var(--ink)}
.rels button .ct{font-family:var(--mono);font-size:10px;color:var(--ink-3)}

.yr{display:flex;flex-direction:column;gap:8px}
.yrhead{
  display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
  color:var(--cyan);text-transform:uppercase;letter-spacing:.1em;
}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule)}
input[type=range]::-moz-range-track{height:1px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:9px;height:16px;margin-top:-8px;
  background:var(--magenta);border:0;box-shadow:0 0 12px -1px var(--magenta);
}
input[type=range]::-moz-range-thumb{width:9px;height:16px;border-radius:0;background:var(--magenta);border:0}

.chk{display:flex;align-items:center;gap:9px;padding:3px 0;cursor:pointer;color:var(--ink-2);font-size:12px;letter-spacing:.03em}
.chk input{accent-color:var(--magenta);width:13px;height:13px}
.chk:hover{color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  padding:4px 8px;background:rgba(0,240,255,.06);border:1px solid var(--rule);
  font-family:var(--mono);font-size:10px;color:var(--ink-2);cursor:pointer;letter-spacing:.04em;
}
.chip:hover{border-color:var(--magenta);color:var(--ink);box-shadow:0 0 16px -6px var(--magenta)}

/* ============ stage ============ */
#cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none;position:relative;z-index:0}
#cv.grabbing{cursor:grabbing}
#cv.pointing{cursor:pointer}
.hud{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:2}
.hud .row{display:flex;gap:6px;pointer-events:auto}
.zbtn{
  width:28px;height:28px;background:rgba(19,11,49,.82);border:1px solid var(--rule);
  color:var(--ink-2);cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;
}
.zbtn:hover{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 16px -6px var(--cyan)}
.zbtn.wide{width:auto;padding:0 10px;font-family:var(--ui);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.stat{
  position:absolute;right:14px;bottom:14px;font-family:var(--mono);font-size:10.5px;
  color:var(--ink-3);letter-spacing:.1em;text-align:right;line-height:1.8;
  pointer-events:none;z-index:2;text-transform:uppercase;
}
.pathbar{
  position:absolute;left:14px;right:14px;top:14px;display:none;gap:12px;align-items:center;
  padding:9px 12px;background:rgba(13,7,38,.92);border:1px solid var(--magenta);z-index:2;
  box-shadow:0 0 30px -10px var(--magenta),inset 0 0 30px -22px var(--magenta);
}
.pathbar.on{display:flex}
.pathbar .lbl{
  font-family:var(--ui);font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--magenta);flex:none;
}
.pathbar .body{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);flex:1;min-width:0;overflow-x:auto;white-space:nowrap}
.pathbar .body b{color:var(--ink);font-weight:400}
.pathbar .body i{color:var(--cyan);font-style:normal}
.pathbar button{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;flex:none}
.pathbar button:hover{color:var(--magenta)}

/* ============ inspector ============ */
.tabs{display:flex;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{
  flex:1;padding:12px 4px 10px;background:none;border:0;border-bottom:1px solid transparent;
  font-family:var(--ui);font-size:10.5px;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-3);cursor:pointer;margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--cyan);border-bottom-color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.pane{display:none}
.pane.on{display:block}

.card{padding:17px 15px 15px;border-bottom:1px solid var(--rule-soft)}
.kind{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.kind .dot{width:8px;height:8px;border-radius:50%}
.kind .k{font-family:var(--ui);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-3)}
.card h3{
  margin:0;font-family:var(--display);font-weight:500;font-size:23px;
  letter-spacing:.05em;line-height:1.18;text-wrap:balance;color:var(--ink);
}
.meta{margin:9px 0 0;font-family:var(--mono);font-size:10.5px;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase}
.note{margin:10px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.65;max-width:44ch}
.cardbtns{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.mini{
  padding:5px 10px;background:transparent;border:1px solid var(--rule);
  font-family:var(--ui);font-size:10px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-2);cursor:pointer;
}
.mini:hover{color:var(--cyan);border-color:var(--cyan)}
.mini.hot{border-color:var(--magenta);color:var(--magenta);box-shadow:0 0 18px -7px var(--magenta)}
.mini.danger:hover{border-color:#ff4d6d;color:#ff4d6d}

.grp{padding:12px 15px 13px;border-bottom:1px solid var(--rule-soft)}
.grp h4{
  margin:0 0 7px;font-family:var(--ui);font-size:10px;font-weight:500;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ink-3);
}
.lk{
  display:grid;grid-template-columns:8px 1fr auto;gap:9px;align-items:baseline;
  width:100%;padding:4px 7px;margin-left:-7px;background:none;border:0;
  border-left:1px solid transparent;text-align:left;cursor:pointer;
}
.lk:hover{background:rgba(0,240,255,.07);border-left-color:var(--cyan)}
.lk .dot{width:8px;height:8px;border-radius:50%;transform:translateY(1px)}
.lk .nm{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em}
.lk .yr{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.empty{padding:28px 16px;color:var(--ink-3);font-size:12.5px;line-height:1.75;max-width:40ch}
.empty b{color:var(--ink-2);font-weight:500}
.empty code{font-family:var(--mono);font-size:11px;color:var(--magenta)}

.form{padding:15px}
.form label{display:block;margin-bottom:11px}
.form .cap{
  display:block;margin-bottom:5px;font-family:var(--ui);font-size:10px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);
}
.form input[type=text],.form input[type=number],.form select,.form textarea{
  width:100%;padding:7px 9px;background:rgba(7,4,26,.7);border:1px solid var(--rule);
  font-size:12.5px;font-family:var(--ui);color:var(--ink);
}
.form textarea{resize:vertical;min-height:52px}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 16px -6px var(--cyan)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fh{
  margin:0 0 12px;font-family:var(--ui);font-size:10px;font-weight:500;
  letter-spacing:.24em;text-transform:uppercase;color:var(--magenta);
}
.go{
  width:100%;padding:9px;margin-top:2px;background:var(--magenta);border:1px solid var(--magenta);
  color:#12001a;font-family:var(--ui);font-size:11.5px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 0 24px -8px var(--magenta);
}
.go:hover{filter:brightness(1.15)}
.go.ghost{background:none;color:var(--ink-2);border-color:var(--rule);box-shadow:none}
.go.ghost:hover{color:var(--cyan);border-color:var(--cyan);filter:none}
.say{margin:10px 0 0;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);line-height:1.65;min-height:1.65em}
.say.ok{color:var(--t-song)}
.say.bad{color:#ff4d6d}

.store{
  display:flex;align-items:center;gap:9px;padding:10px 15px;border-bottom:1px solid var(--rule-soft);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;
}
.store .led{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.store.live .led{background:var(--t-song);box-shadow:0 0 10px var(--t-song)}
.store.live{color:var(--ink-2)}

.hubs{display:flex;flex-direction:column;gap:3px}
.hub{display:grid;grid-template-columns:1fr 36px 24px;gap:8px;align-items:center;
  width:100%;background:none;border:0;padding:3px 0;cursor:pointer;text-align:left}
.hub .nm{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em}
.hub:hover .nm{color:var(--cyan)}
.hub .bar2{height:3px;background:var(--rule-soft);overflow:hidden}
.hub .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--magenta));box-shadow:0 0 8px -1px var(--magenta)}
.hub .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:right}

/* ============ mobile furniture ============ */
.scrim{
  position:absolute;inset:var(--barh) 0 0;z-index:6;display:none;
  background:rgba(4,1,14,.66);backdrop-filter:blur(2px);
}
.scrim.on{display:block}
.sheetgrip{display:none}
.peek{
  position:absolute;left:10px;right:10px;bottom:58px;z-index:3;display:none;
  align-items:center;gap:10px;padding:9px 10px;
  background:rgba(13,7,38,.94);border:1px solid var(--rule);
  box-shadow:0 -6px 30px -16px var(--magenta);
}
.peek.on{display:flex}
.peek .pkdot{width:9px;height:9px;border-radius:50%;flex:none}
.peek .pktext{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.peek b{
  font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.03em;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.peek i{font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase}
.peek button{
  flex:none;height:34px;padding:0 12px;background:transparent;border:1px solid var(--cyan);
  color:var(--cyan);font-family:var(--ui);font-size:10.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
}

@media (max-width:1080px){
  .deck{grid-template-columns:1fr}
  .rail{position:absolute;top:var(--barh);bottom:0;width:292px;z-index:7;display:none;
    box-shadow:0 0 60px -6px rgba(0,0,0,.85)}
  .rail.left{left:0}
  .rail.right{right:0;border-left:1px solid var(--rule)}
  .rail.open{display:block}
  .stage{grid-column:1}
  .drawerbtn{display:block}
  .mark .sub{display:none}
}
/* Phones and small tablets: the inspector is a bottom sheet, not a side
   drawer — a 292px drawer over a 390px screen hides the graph you are
   inspecting, which is the whole point of tapping a node. */
@media (max-width:820px){
  .rail.left{width:min(86vw,300px)}
  .rail.right{
    left:0;right:0;top:auto;bottom:0;width:auto;height:min(62dvh,540px);
    border-left:0;border-top:1px solid var(--magenta);
    box-shadow:0 -10px 50px -18px var(--magenta);
  }
  .sheetgrip{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 12px 4px;position:sticky;top:0;background:var(--panel);z-index:3;
  }
  .sheetgrip .grip{flex:1;height:3px;background:var(--rule);max-width:52px;margin:0 auto}
  .sheetgrip button{
    background:none;border:0;color:var(--ink-3);cursor:pointer;padding:4px 2px;
    font-family:var(--ui);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  }
  .sheetgrip button:hover{color:var(--magenta)}
  .tabs{top:26px}
  .stat{display:none}
  .hud{left:10px;bottom:10px}
  .zbtn{width:38px;height:38px;font-size:17px}
  .zbtn.wide{padding:0 13px;font-size:11px}
  .pathbar{left:10px;right:10px;top:10px}
  .lk{padding:8px 7px}
  .chip{padding:6px 9px;font-size:11px}
  .tabs button{padding:14px 4px 12px}
  .tog button{padding:8px}
  .rels button{padding:7px 8px}
  .chk{padding:6px 0}
}
@media (max-width:700px){
  :root{--barh:92px}
  .bar{
    display:grid;height:auto;padding:9px 10px;gap:8px;align-items:center;
    grid-template-columns:1fr auto auto auto;grid-template-rows:auto auto;
  }
  .mark{grid-column:1;grid-row:1;min-width:0;overflow:hidden}

  k: 1, tx: 0, ty: 0, alpha: 1,
};
const OV_NODES = new Map();   // overlay: id -> {…, deleted?}
const OV_EDGES = new Map();
let db = null, downloads = null, storeLive = false;

let nodes = [], edges = [], byId = new Map(), adj = new Map();
const posMemo = new Map();

/* ============================================================ 3. GRAPH BUILD */
function edgeKey(f, t, r) { return f + "+" + t + "+" + r; }

function buildGraph() {
  byId = new Map();
  const push = (a) => {
    const [id, type, name, year, note] = a;
    byId.set(id, { id, type, name, year: year ?? null, note: note ?? null, own: false });
  };
  BASE_NODES.forEach(push);
  for (const [id, d] of OV_NODES) {
    if (d.deleted) { byId.delete(id); continue; }
    const prev = byId.get(id) || {};
    byId.set(id, { ...prev, id, type: d.type, name: d.name, year: d.year ?? null,
                   note: d.note ?? null, own: true });
  }
  const em = new Map();
  for (const a of BASE_EDGES) {
    const [f, t, r, y, note] = a;
    em.set(edgeKey(f, t, r), { id: edgeKey(f, t, r), f, t, rel: r, year: y ?? null,
                               note: note ?? null, own: false });
  }
  for (const [id, d] of OV_EDGES) {
    if (d.deleted) { em.delete(id); continue; }
    em.set(id, { id, f: d.f, t: d.t, rel: d.rel, year: d.year ?? null,
                 note: d.note ?? null, own: true });
  }

  nodes = [...byId.values()];
  edges = [...em.values()].filter(e => byId.has(e.f) && byId.has(e.t) && e.f !== e.t);

  adj = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) { adj.get(e.f).push(e); adj.get(e.t).push(e); }

  const R = 300, cx = 0, cy = 0;
  nodes.forEach((n, i) => {
    n.deg = adj.get(n.id).length;
    n.r = Math.min(15, 3.6 + Math.sqrt(n.deg) * 2.1);
    const p = posMemo.get(n.id);
    if (p) { n.x = p.x; n.y = p.y; n.vx = p.vx || 0; n.vy = p.vy || 0; }
    else {
      // seed by type-ring so the first settle converges fast
      const ti = TYPES.findIndex(t => t[0] === n.type);
      const a = (i * 2.399963) + ti;
      const rad = R * (0.35 + 0.65 * ((ti + 1) / TYPES.length));
      n.x = cx + Math.cos(a) * rad; n.y = cy + Math.sin(a) * rad; n.vx = 0; n.vy = 0;
    }
    n.pin = n.pin || false;
  });
  for (const e of edges) { e.a = byId.get(e.f); e.b = byId.get(e.t); }
}

function memoPositions() {
  for (const n of nodes) posMemo.set(n.id, { x: n.x, y: n.y, vx: n.vx, vy: n.vy });
}

/* ============================================================ 4. FILTERS */
function inYear(y) {
  if (y == null) return S.keepUndated;
  return (S.yFrom <= SMIN || y >= S.yFrom) && (S.yTo >= SMAX || y <= S.yTo);
}

function applyFilters() {
  for (const n of nodes) n.vis = S.types.has(n.type) && inYear(n.year);
  for (const e of edges) e.vis = S.rels.has(e.rel) && e.a.vis && e.b.vis && inYear(e.year);
  if (S.hideOrphans) {
    const touched = new Set();
    for (const e of edges) if (e.vis) { touched.add(e.f); touched.add(e.t); }
    for (const n of nodes) if (n.vis && !touched.has(n.id)) n.vis = false;
    for (const e of edges) e.vis = e.vis && e.a.vis && e.b.vis;
  }
  if (S.matched && !S.dim) {
    for (const n of nodes) n.vis = n.vis && S.matched.has(n.id);
    for (const e of edges) e.vis = e.vis && e.a.vis && e.b.vis;
  }
  for (const n of nodes) n.vdeg = 0;
  for (const e of edges) if (e.vis) { e.a.vdeg++; e.b.vdeg++; }
}

/* ============================================================ 5. FORCE LAYOUT */
function tick(dt) {
  const live = nodes.filter(n => n.vis);
  const a = S.alpha;
  const REP = 2400 * a;
  for (let i = 0; i < live.length; i++) {
    const p = live[i];
    for (let j = i + 1; j < live.length; j++) {
      const q = live[j];
      let dx = q.x - p.x, dy = q.y - p.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 0.01) { dx = (Math.random() - .5); dy = (Math.random() - .5); d2 = 0.01; }
      if (d2 > 90000) continue;
      const f = REP / d2, d = Math.sqrt(d2);
      const fx = (dx / d) * f, fy = (dy / d) * f;
      p.vx -= fx; p.vy -= fy; q.vx += fx; q.vy += fy;
    }
  }
  for (const e of edges) {
    if (!e.vis) continue;
    const L = RELS[e.rel] ? RELS[e.rel].len : 60;
    const p = e.a, q = e.b;
    const dx = q.x - p.x, dy = q.y - p.y;
    const d = Math.hypot(dx, dy) || 0.01;
    const f = (d - L) * 0.035 * a;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    p.vx += fx; p.vy += fy; q.vx -= fx; q.vy -= fy;
  }
  for (const n of live) {
    n.vx -= n.x * 0.0016 * a; n.vy -= n.y * 0.0016 * a;
    if (n.pin) { n.vx = 0; n.vy = 0; continue; }
    n.vx *= 0.82; n.vy *= 0.82;
    n.x += Math.max(-18, Math.min(18, n.vx));
    n.y += Math.max(-18, Math.min(18, n.vy));
  }
  S.alpha = Math.max(0.02, S.alpha * 0.994);
}
function reheat(v) { S.alpha = Math.max(S.alpha, v || 0.55); loop(); }

/* ============================================================ 6. RENDER */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
const css = getComputedStyle(document.documentElement);
let C = {};
function readColors() {
  const g = (v) => css.getPropertyValue(v).trim();
  C = { bg: g("--canvas-bg"), edge: g("--edge-line"), ink: g("--ink"),
        ink2: g("--ink-2"), ink3: g("--ink-3"), plate: g("--plate"),
        grid: g("--grid"), hzA: g("--horizon-a"), hzB: g("--horizon-b"),
        lamp: g("--cyan"), hot: g("--magenta"), violet: g("--violet") };
  for (const [k, , v] of TYPES) C[k] = g(v);
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  draw();
}
const toWorld = (sx, sy) => ({ x: (sx - S.tx) / S.k, y: (sy - S.ty) / S.k });
/* Node size lives in world units so the layout can use it, but it is DRAWN at a
   bounded SCREEN size — otherwise zooming in turns a node into a blob. */
const drawR = (n) => Math.max(3 / S.k, Math.min(n.r, 26 / S.k));

function neighbourSet(id, depth) {
  const seen = new Set([id]); let front = [id];
  for (let d = 0; d < depth; d++) {
    const next = [];
    for (const cur of front) for (const e of (adj.get(cur) || [])) {
      if (!S.rels.has(e.rel)) continue;
      const o = e.f === cur ? e.t : e.f;
      if (!seen.has(o)) { seen.add(o); next.push(o); }
    }
    front = next;
  }
  return seen;
}

/* The room the graph floats in: a horizon, a glow behind it, and a plane
   receding to a vanishing point. Screen space — it is scenery, not data. */
function drawBackdrop() {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const hy = Math.round(H * 0.42), vx = W / 2;

  const sun = ctx.createRadialGradient(vx, hy, 0, vx, hy, Math.max(W, H) * 0.58);
  sun.addColorStop(0, C.hzB); sun.addColorStop(0.35, C.hzA); sun.addColorStop(1, "transparent");
  ctx.globalAlpha = 0.13; ctx.fillStyle = sun;
  ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;

  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  ctx.globalAlpha = 0.26;
  ctx.beginPath();
  for (let j = -16; j <= 16; j++) {
    ctx.moveTo(vx, hy); ctx.lineTo(vx + j * (W / 8), H + 2);
  }
  ctx.stroke();
  ctx.beginPath();
  for (let i = 1; i <= 20; i++) {
    const y = hy + (H - hy) * Math.pow(i / 20, 2.6);
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();

  ctx.globalAlpha = 0.34; ctx.strokeStyle = C.hzA;
  ctx.beginPath(); ctx.moveTo(0, hy + .5); ctx.lineTo(W, hy + .5); ctx.stroke();

  const vig = ctx.createRadialGradient(vx, H * 0.52, 0, vx, H * 0.52, Math.max(W, H) * 0.62);
  vig.addColorStop(0, "transparent"); vig.addColorStop(0.4, "transparent"); vig.addColorStop(1, C.bg);
  ctx.globalAlpha = 0.92; ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackdrop();
  ctx.setTransform(DPR * S.k, 0, 0, DPR * S.k, DPR * S.tx, DPR * S.ty);

  const focus = S.hover || S.sel;
  const halo = focus ? neighbourSet(focus, 1) : null;
  const pathIds = S.path ? new Set(S.path.nodes) : null;
  const pathEdges = S.path ? new Set(S.path.edges) : null;
  const lit = (id) => {
    if (pathIds) return pathIds.has(id);
    if (halo) return halo.has(id);
    return true;
  };
  const inQuery = (id) => !S.matched || S.matched.has(id);

  /* edges */
  ctx.lineCap = "round";
  for (const pass of [0, 1]) {
    for (const e of edges) {
      if (!e.vis) continue;
      const hot = pathEdges ? pathEdges.has(e.id)
                : halo ? (e.f === focus || e.t === focus) : false;
      if ((pass === 1) !== hot) continue;
      const q = inQuery(e.f) && inQuery(e.t);
      let al = hot ? 0.95 : (halo || pathIds ? 0.12 : 0.42);
      if (!q) al *= 0.22;
      const st = RELS[e.rel] ? RELS[e.rel].style : "solid";
      ctx.setLineDash(st === "dash" ? [5 / S.k, 4 / S.k] : st === "dot" ? [1.5 / S.k, 3.5 / S.k] : []);
      ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y);
      if (hot) {
        ctx.strokeStyle = C.hot; ctx.globalAlpha = 0.22; ctx.lineWidth = 5 / S.k; ctx.stroke();
        ctx.strokeStyle = C.lamp; ctx.globalAlpha = al; ctx.lineWidth = 1.6 / S.k; ctx.stroke();
      } else {
        ctx.strokeStyle = C.edge; ctx.globalAlpha = al; ctx.lineWidth = 1 / S.k; ctx.stroke();
      }
    }
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  /* nodes */
  for (const n of nodes) {
    if (!n.vis) continue;
    const q = inQuery(n.id), l = lit(n.id);
    let al = l ? 1 : 0.16;
    if (!q) al = Math.min(al, 0.1);
    const rr = drawR(n);
    ctx.fillStyle = C[n.type] || C.ink3;
    ctx.globalAlpha = al * (l ? 0.24 : 0.1);
    ctx.beginPath(); ctx.arc(n.x, n.y, rr * 2, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = al;
    ctx.beginPath(); ctx.arc(n.x, n.y, rr, 0, 6.2832); ctx.fill();
    if (n.own) { ctx.lineWidth = 1.6 / S.k; ctx.strokeStyle = C.bg; ctx.stroke(); }
    if (n.id === S.sel || (pathIds && pathIds.has(n.id))) {
      ctx.strokeStyle = C.hot; ctx.globalAlpha = 0.3; ctx.lineWidth = 5 / S.k;
      ctx.beginPath(); ctx.arc(n.x, n.y, rr + 4 / S.k, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = C.lamp; ctx.globalAlpha = 1; ctx.lineWidth = 1.5 / S.k;
      ctx.beginPath(); ctx.arc(n.x, n.y, rr + 4 / S.k, 0, 6.2832); ctx.stroke();
    }
  }

  /* Labels are laid out in SCREEN space, most important first, and a label
     that would collide with one already placed is dropped. Without this the
     zoomed-out view a phone opens at stacks every neighbour's name into an
     unreadable pile of plates. */
  ctx.globalAlpha = 1; ctx.textAlign = "center"; ctx.textBaseline = "top";
  const thresh = S.showLabels ? (S.k > 1.5 ? 0 : S.k > 0.9 ? 4 : 9) : 999;
  const cand = [];
  for (const n of nodes) {
    if (!n.vis) continue;
    const pri = n.id === S.sel ? 0
              : n.id === S.hover ? 1
              : (pathIds && pathIds.has(n.id)) ? 2
              : (halo && halo.has(n.id)) ? 3 : 9;
    if (pri === 9 && (n.deg < thresh || !inQuery(n.id))) continue;
    cand.push({ n, pri });
  }
  cand.sort((a, b) => a.pri - b.pri || b.n.deg - a.n.deg);
  const size = (W < 620 ? 12 : 11) / S.k, lh = size + 3 / S.k;
  ctx.font = `500 ${size}px "Chakra Petch", system-ui, sans-serif`;
  const taken = [];
  for (const { n, pri } of cand) {
    const txt = n.name.length > 30 ? n.name.slice(0, 29) + "…" : n.name;
    const w = ctx.measureText(txt).width + 6 / S.k;
    const x = n.x - w / 2, y = n.y + drawR(n) + 4 / S.k;
    const sx = x * S.k + S.tx, sy = y * S.k + S.ty, sw = w * S.k, sh = lh * S.k;
    if (sx + sw < 0 || sx > W || sy + sh < 0 || sy > H) continue;
    let clash = false;
    for (const r of taken) {
      if (sx < r.x + r.w && sx + sw > r.x && sy < r.y + r.h && sy + sh > r.y) { clash = true; break; }
    }
    if (clash) continue;
    taken.push({ x: sx, y: sy, w: sw, h: sh });
    ctx.globalAlpha = pri < 9 ? 0.96 : 0.66;
    ctx.fillStyle = C.plate; ctx.fillRect(x, y - 1 / S.k, w, lh);
    ctx.fillStyle = pri < 9 ? C.ink : C.ink2;
    ctx.fillText(txt, n.x, y);
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

let raf = 0;
function loop() {
  if (raf) return;
  const step = () => {
    raf = 0;
    if (!S.freeze) tick();
    draw();
    if (!S.freeze && S.alpha > 0.021) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function redraw() { if (!raf) draw(); }

function fit(ids) {
  const set = ids ? new Set(ids) : null;
  const pool = nodes.filter(n => n.vis && (!set || set.has(n.id)));
  if (!pool.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of pool) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
  const pad = W < 620 ? 26 : 52;
  S.k = Math.max(0.15, Math.min(2.6, Math.min((W - pad * 2) / Math.max(1, x1 - x0), (H - pad * 2) / Math.max(1, y1 - y0))));
  S.tx = W / 2 - ((x0 + x1) / 2) * S.k;
  S.ty = H / 2 - ((y0 + y1) / 2) * S.k;
  redraw();
}
</script>

<script>
/* ============================================================ 7. QUERY */
const strip = (s) => s.replace(/^"|"$/g, "");
const findByName = (q) => {
  const s = q.toLowerCase();
  let exact = null, part = null;
  for (const n of nodes) {
    const nm = n.name.toLowerCase();
    if (nm === s) { exact = n; break; }
    if (!part && nm.includes(s)) part = n;
  }
  return exact || part;
};

function shortestPath(aId, bId) {
  if (aId === bId) return null;
  const prev = new Map([[aId, null]]);
  let front = [aId];
  while (front.length) {
    const next = [];
    for (const cur of front) {
      for (const e of (adj.get(cur) || [])) {
        if (!S.rels.has(e.rel)) continue;
        const o = e.f === cur ? e.t : e.f;
        if (prev.has(o)) continue;
        prev.set(o, { via: e, from: cur });
        if (o === bId) {
          const ns = [], es = [];
          let c = bId;
          while (c) { ns.push(c); const p = prev.get(c); if (!p) break; es.push(p.via.id); c = p.from; }
          ns.reverse(); es.reverse();
          return { nodes: ns, edges: es };
        }
        next.push(o);
      }
    }
    front = next;
  }
  return null;
}

function cmpYear(y, op, a, b) {
  if (y == null) return false;
  if (op === ">") return y > a; if (op === "<") return y < a;
  if (op === ">=") return y >= a; if (op === "<=") return y <= a;
  if (op === "..") return y >= a && y <= b;
  return y === a;
}
function parseNum(v) {
  let m = v.match(/^(\d{3,4})\.\.(\d{3,4})$/); if (m) return { op: "..", a: +m[1], b: +m[2] };
  m = v.match(/^(>=|<=|>|<)?\s*(-?\d+)$/); if (m) return { op: m[1] || "=", a: +m[2], b: 0 };
  return null;
}

function runQuery(raw) {
  S.path = null;
  const src = raw.trim();
  if (!src) { S.matched = null; return { ok: true, n: null }; }

  const pm = src.match(/path:\s*("[^"]*"|[^\s>]+)\s*(?:->|>)\s*("[^"]*"|.+)$/i);
  if (pm) {
    const A = findByName(strip(pm[1].trim())), B = findByName(strip(pm[2].trim()));
    if (!A || !B) return { ok: false, msg: "No entity named " + (A ? pm[2] : pm[1]) };
    const p = shortestPath(A.id, B.id);
    if (!p) { S.matched = null; return { ok: false, msg: "No route between them with these relationships on" }; }
    S.path = p; S.matched = new Set(p.nodes); S.sel = A.id;
    return { ok: true, n: p.nodes.length, path: true };
  }

  const toks = src.match(/-?(?:\w+:)?(?:"[^"]*"|[^\s"]+)(?:~\d+)?/g) || [];
  const preds = [];
  for (let t of toks) {
    const neg = t.startsWith("-"); if (neg) t = t.slice(1);
    const c = t.indexOf(":");
    const key = c > 0 ? t.slice(0, c).toLowerCase() : "";
    let val = c > 0 ? t.slice(c + 1) : t;
    let depth = 1;
    const dm = val.match(/~(\d+)$/); if (dm) { depth = +dm[1]; val = val.slice(0, -dm[0].length); }
    val = strip(val);
    let fn = null;
    if (key === "type") { const set = new Set(val.toLowerCase().split(",")); fn = (n) => set.has(n.type); }
    else if (key === "rel") { const set = new Set(val.toLowerCase().split(",")); fn = (n) => (adj.get(n.id) || []).some(e => set.has(e.rel)); }
    else if (key === "year") { const p = parseNum(val); if (!p) return { ok: false, msg: "Bad year: " + val }; fn = (n) => cmpYear(n.year, p.op, p.a, p.b); }
    else if (key === "deg") { const p = parseNum(val); if (!p) return { ok: false, msg: "Bad degree: " + val }; fn = (n) => cmpYear(n.deg, p.op, p.a, p.b); }
    else if (key === "near") {
      const a = findByName(val); if (!a) return { ok: false, msg: "No entity named " + val };
      const set = neighbourSet(a.id, Math.min(6, depth)); fn = (n) => set.has(n.id);
    }
    else if (key === "name" || key === "") { const s = val.toLowerCase(); fn = (n) => n.name.toLowerCase().includes(s); }
    else return { ok: false, msg: "Unknown filter: " + key + ":" };
    preds.push(neg ? (n) => !fn(n) : fn);
  }
  const out = new Set();
  for (const n of nodes) if (preds.every(p => p(n))) out.add(n.id);
  S.matched = out;
  return { ok: true, n: out.size };
}

/* ============================================================ 8. DOM HELPERS */
const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const dot = (type) => { const d = el("span", "dot"); d.style.background = "var(--t-" + type + ")"; return d; };

/* ============================================================ 9. LEFT RAIL */
function renderFilters() {
  const counts = {}, rcounts = {};
  for (const n of nodes) counts[n.type] = (counts[n.type] || 0) + 1;
  for (const e of edges) rcounts[e.rel] = (rcounts[e.rel] || 0) + 1;

  const tt = $("typeTog"); tt.textContent = "";
  for (const [k, label, v] of TYPES) {
    const b = el("button"); b.type = "button";
    b.className = S.types.has(k) ? "on" : "";
    const d = el("span", "dot"); d.style.color = "var(" + v + ")";
    b.append(d, el("span", "nm", label), el("span", "ct", String(counts[k] || 0)));
    b.onclick = () => { S.types.has(k) ? S.types.delete(k) : S.types.add(k); refresh(true); };
    tt.append(b);
  }
  const rt = $("relTog"); rt.textContent = "";
  for (const k of REL_KEYS) {
    const b = el("button"); b.type = "button";
    b.className = S.rels.has(k) ? "on" : "";
    const ln = el("span", "ln");
    const st = RELS[k].style;
    ln.style.borderTopStyle = st === "dash" ? "dashed" : st === "dot" ? "dotted" : "solid";
    b.append(ln, el("span", "nm", RELS[k].label), el("span", "ct", String(rcounts[k] || 0)));
    b.onclick = () => { S.rels.has(k) ? S.rels.delete(k) : S.rels.add(k); refresh(true); };
    rt.append(b);
  }
  const hubs = $("hubs"); hubs.textContent = "";
  const top = [...nodes].sort((a, b) => b.deg - a.deg).slice(0, 9);
  const max = top.length ? top[0].deg : 1;
  for (const n of top) {
    const b = el("button", "hub"); b.type = "button";
    const bar = el("span", "bar2"); const i = el("i"); i.style.width = (n.deg / max * 100) + "%"; bar.append(i);
    b.append(el("span", "nm", n.name), bar, el("span", "n", String(n.deg)));
    b.onclick = () => select(n.id, true);
    hubs.append(b);
  }
  const dl = $("allNames"); dl.textContent = "";
  for (const n of [...nodes].sort((a, b) => a.name.localeCompare(b.name))) {
    const o = document.createElement("option"); o.value = n.name; dl.append(o);
  }
}

const PRESETS = [
  ["Studios as hubs", "type:studio,album"],
  ["Everything Albini touched", 'near:"Steve Albini"~1'],
  ["Producers and engineers", "rel:produced,engineered,mixed type:person"],
  ["The 1991 records", "type:album year:1991"],
  ["Cobain to Josh Homme", 'path:"Kurt Cobain"->"Josh Homme"'],
  ["Gear, and what it made", "type:instrument,album,song rel:plays,used_on"],
  ["The connectors", "deg:>7 type:person"],
];
function renderChips() {
  const c = $("chips"); c.textContent = "";
  for (const [label, q] of PRESETS) {
    const b = el("button", "chip", label); b.type = "button";
    b.title = q;
    b.onclick = () => { $("q").value = q; submitQuery(); };
    c.append(b);
  }
}

/* ============================================================ 10. INSPECTOR */
function relRows(n) {
  const groups = new Map();
  for (const e of (adj.get(n.id) || [])) {
    if (!S.rels.has(e.rel)) continue;
    const out = e.f === n.id;
    const other = byId.get(out ? e.t : e.f); if (!other) continue;
    const head = out ? RELS[e.rel].label : RELS[e.rel].inv;
    if (!groups.has(head)) groups.set(head, []);
    groups.get(head).push({ other, e });
  }
  return groups;
}

function renderInspect() {
  const p = $("paneInspect"); p.textContent = "";
  const n = S.sel ? byId.get(S.sel) : null;
  if (!n) {
    const e = el("div", "empty");
    e.innerHTML = "<b>Click any node</b> to read its credits and jump around the graph." +
      "<br><br>Drag the background to pan, scroll to zoom, drag a node to pull it out of the tangle." +
      "<br><br>The search bar takes a query language: <code>type:album year:1991..1994</code>, " +
      "<code>near:\"Sound City\"~2</code>, <code>rel:produced</code>, " +
      "<code>path:\"Kim Deal\"-&gt;\"Dave Grohl\"</code>. Bare words match names.";
    p.append(e); return;
  }
  const card = el("div", "card");
  const kind = el("div", "kind");
  kind.append(dot(n.type), el("span", "k", TYPE_LABEL[n.type] || n.type));
  card.append(kind, el("h3", null, n.name));
  const bits = [];
  if (n.year != null) bits.push(n.type === "person" ? "b. " + n.year : String(n.year));
  bits.push(n.deg + (n.deg === 1 ? " connection" : " connections"));
  if (n.own) bits.push("added here");
  card.append(el("p", "meta", bits.join("  ·  ")));
  if (n.note) card.append(el("p", "note", n.note));

  const btns = el("div", "cardbtns");
  const mk = (label, cls, fn) => { const b = el("button", "mini" + (cls ? " " + cls : ""), label); b.type = "button"; b.onclick = fn; return b; };
  btns.append(mk("Focus", "", () => { $("q").value = 'near:"' + n.name + '"~1'; submitQuery(); }));
  btns.append(mk("Two hops", "", () => { $("q").value = 'near:"' + n.name + '"~2'; submitQuery(); }));
  btns.append(mk(S.armPath ? "Pick a target…" : "Path from here", S.armPath ? "hot" : "", () => {
    S.armPath = !S.armPath; renderInspect();
  }));
  if (n.own) btns.append(mk("Remove", "danger", () => removeNode(n.id)));
  card.append(btns);
  p.append(card);

  const groups = relRows(n);
  const order = [...groups.keys()];
  for (const head of order) {
    const g = el("div", "grp");
    const rows = groups.get(head).sort((a, b) => (a.e.year || 9999) - (b.e.year || 9999));
    g.append(el("h4", null, head + " (" + rows.length + ")"));
    for (const { other, e } of rows) {
      const b = el("button", "lk"); b.type = "button";
      b.append(dot(other.type), el("span", "nm", other.name), el("span", "yr", e.year != null ? String(e.year) : "—"));
      b.title = e.note || (RELS[e.rel].label + " · " + other.name);
      b.onclick = () => select(other.id, false);
      g.append(b);
      if (e.note) { const nt = el("p", "note"); nt.style.margin = "1px 0 6px 16px"; nt.style.fontSize = "11.5px"; nt.textContent = e.note; g.append(nt); }
    }
    p.append(g);
  }
  if (!order.length) p.append(el("div", "empty", "No connections with the current relationship filters."));
}

function renderResults(msg) {
  const p = $("paneResults"); p.textContent = "";
  if (msg) { const e = el("div", "empty"); e.innerHTML = "<b>" + msg + "</b>"; p.append(e); return; }
  if (!S.matched) {
    const e = el("div", "empty");
    e.innerHTML = "<b>Nothing queried yet.</b><br><br>Results land here grouped by kind, with a count you can trust — the query runs over the whole corpus, not just what's on screen.";
    p.append(e); return;
  }
  if (S.path) {
    const g = el("div", "grp");
    g.append(el("h4", null, "Signal path · " + (S.path.nodes.length - 1) + " hops"));
    S.path.nodes.forEach((id, i) => {
      const n = byId.get(id);
      const b = el("button", "lk"); b.type = "button";
      b.append(dot(n.type), el("span", "nm", n.name), el("span", "yr", n.year != null ? String(n.year) : "—"));
      b.onclick = () => select(id, false);
      g.append(b);
      if (i < S.path.edges.length) {
        const e = edges.find(x => x.id === S.path.edges[i]);
        const l = el("p", "note", "↳ " + (e ? RELS[e.rel].label : ""));
        l.style.cssText = "margin:0 0 2px 16px;font-size:11px;color:var(--cyan)";
        g.append(l);
      }
    });
    p.append(g); return;
  }
  const byType = new Map();
  for (const id of S.matched) { const n = byId.get(id); if (!n) continue; if (!byType.has(n.type)) byType.set(n.type, []); byType.get(n.type).push(n); }
  if (!byType.size) { p.append(el("div", "empty", "No matches.")); return; }
  for (const [k, label] of TYPES.map(t => [t[0], t[1]])) {
    const list = byType.get(k); if (!list) continue;
    const g = el("div", "grp");
    g.append(el("h4", null, label + " (" + list.length + ")"));
    list.sort((a, b) => (a.year || 9999) - (b.year || 9999) || a.name.localeCompare(b.name));
    for (const n of list) {
      const b = el("button", "lk"); b.type = "button";
      b.append(dot(n.type), el("span", "nm", n.name), el("span", "yr", n.year != null ? String(n.year) : "—"));
      b.onclick = () => select(n.id, false);
      g.append(b);
    }
    p.append(g);
  }
}

/* On a phone the inspector is a sheet that covers the graph, so a tap shows a
   one-line peek instead and the sheet opens only when asked for. */
function renderPeek() {
  const pk = $("peek"), n = S.sel ? byId.get(S.sel) : null;
  if (!n || !isNarrow()) { pk.classList.remove("on"); return; }
  $("pkDot").style.background = "var(--t-" + n.type + ")";
  $("pkName").textContent = n.name;
  const bits = [TYPE_LABEL[n.type] || n.type];
  if (n.year != null) bits.push(n.year);
  bits.push(n.deg + " links");
  $("pkMeta").textContent = bits.join("  ·  ");
  pk.classList.add("on");
}

function renderPathbar() {
  const bar = $("pathbar"), body = $("pathbody");
  if (!S.path) { bar.classList.remove("on"); return; }
  bar.classList.add("on"); body.textContent = "";
  S.path.nodes.forEach((id, i) => {
    if (i) {
      const e = edges.find(x => x.id === S.path.edges[i - 1]);
      const rel = el("i", null, "  " + (e ? RELS[e.rel].label : "→") + "  →  ");
      body.append(rel);
    }
    body.append(el("b", null, byId.get(id).name));
  });
}
</script>

<script>
/* ============================================================ 11. FLOW */
function refresh(relayout) {
  applyFilters();
  renderFilters();
  renderInspect();
  renderPeek();
  renderStat();
  renderPathbar();
  if (relayout) reheat(0.5); else redraw();
}
function select(id, doFit) {
  if (S.armPath && S.sel && id !== S.sel) {
    const p = shortestPath(S.sel, id);
    S.armPath = false;
    if (p) { S.path = p; S.matched = new Set(p.nodes); S.sel = id; showPane("paneResults", true); }
    else { say("sayNode", "No route with these relationships on", "bad"); }
    renderResults(); renderPathbar(); refresh(false); fit(p ? p.nodes : null); return;
  }
  S.sel = id;
  renderInspect();
  renderPeek();
  if (doFit) {
    const n = byId.get(id);
    if (n) { S.k = Math.max(S.k, 1.1); S.tx = W / 2 - n.x * S.k; S.ty = H / 2 - n.y * S.k; }
  }
  showPane("paneInspect", false);
  redraw();
}
function renderStat() {
  const vn = nodes.filter(n => n.vis).length, ve = edges.filter(e => e.vis).length;
  $("stat").innerHTML = vn + " / " + nodes.length + " entities<br>" + ve + " / " + edges.length + " connections";
}
function submitQuery() {
  const raw = $("q").value;
  const r = runQuery(raw);
  const c = $("qcount");
  if (!r.ok) {
    c.textContent = "?"; c.classList.remove("on");
    renderResults(r.msg); showPane("paneResults", true); S.matched = null;
  } else if (r.n == null) {
    c.textContent = ""; c.classList.remove("on"); renderResults();
  } else {
    c.textContent = r.path ? (r.n - 1) + " hops" : r.n + " hits"; c.classList.add("on");
    renderResults(); showPane("paneResults", true);
  }
  applyFilters(); renderStat(); renderPathbar(); renderInspect(); renderPeek();
  if (r.ok && r.n) fit(S.matched); else redraw();
}

/* ============================================================ 12. CANVAS INPUT */
let drag = null, moved = 0, lastTap = { id: null, t: 0 };
const PTS = new Map();            /* live pointers, so two fingers can pinch */
let pinch = null;
const isNarrow = () => window.matchMedia("(max-width:820px)").matches;
const isTouch = (ev) => ev.pointerType === "touch" || ev.pointerType === "pen";
const localPt = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };

/* A fingertip is much blunter than a cursor, so touch gets a wider catch. */
function pick(sx, sy, tol) {
  const w = toWorld(sx, sy);
  let best = null, bd = Infinity;
  for (const n of nodes) {
    if (!n.vis) continue;
    const d = Math.hypot(n.x - w.x, n.y - w.y);
    if (d < drawR(n) + (tol || 6) / S.k && d < bd) { bd = d; best = n; }
  }
  return best;
}

function startPinch() {
  const [a, b] = [...PTS.values()];
  if (drag && drag.node && !drag.wasPin) drag.node.pin = false;
  drag = null;
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1,
            mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2,
            k: S.k, tx: S.tx, ty: S.ty };
}

cv.addEventListener("pointerdown", (ev) => {
  cv.setPointerCapture(ev.pointerId);
  const p = localPt(ev);
  PTS.set(ev.pointerId, p);
  if (PTS.size === 2) { startPinch(); return; }
  if (PTS.size > 2) return;
  const n = pick(p.x, p.y, isTouch(ev) ? 20 : 6);
  moved = 0;
  drag = n ? { node: n, sx: p.x, sy: p.y, wasPin: n.pin }
           : { pan: true, sx: p.x, sy: p.y, tx: S.tx, ty: S.ty };
  if (n) n.pin = true;
  cv.classList.add("grabbing");
});

cv.addEventListener("pointermove", (ev) => {
  const p = localPt(ev);
  if (PTS.has(ev.pointerId)) PTS.set(ev.pointerId, p);

  if (pinch && PTS.size >= 2) {
    const [a, b] = [...PTS.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const k = Math.max(0.12, Math.min(4.5, pinch.k * (d / pinch.d)));
    /* the world point that started under the midpoint stays under it, so the
       gesture zooms and pans in one move the way a map does */
    const wx = (pinch.mx - pinch.tx) / pinch.k, wy = (pinch.my - pinch.ty) / pinch.k;
    S.k = k; S.tx = (a.x + b.x) / 2 - wx * k; S.ty = (a.y + b.y) / 2 - wy * k;
    redraw();
    return;
  }
  if (!drag) {
    if (isTouch(ev)) return;                       /* no hover state on touch */
    const n = pick(p.x, p.y, 6);
    const id = n ? n.id : null;
    cv.classList.toggle("pointing", !!n);
    if (id !== S.hover) { S.hover = id; redraw(); }
    return;
  }
  moved = Math.max(moved, Math.hypot(p.x - drag.sx, p.y - drag.sy));
  if (drag.pan) { S.tx = drag.tx + (p.x - drag.sx); S.ty = drag.ty + (p.y - drag.sy); redraw(); }
  else { const w = toWorld(p.x, p.y); drag.node.x = w.x; drag.node.y = w.y; drag.node.vx = 0; drag.node.vy = 0; reheat(0.35); }
});

function endPointer(ev) {
  PTS.delete(ev.pointerId);
  if (PTS.size < 2) pinch = null;
  cv.classList.remove("grabbing");
  if (!drag) { memoPositions(); return; }
  const tap = moved < 8;
  if (drag.node) {
    if (!ev.shiftKey && !drag.wasPin) drag.node.pin = false;
    if (tap) {
      const id = drag.node.id, now = performance.now();
      if (lastTap.id === id && now - lastTap.t < 340) {
        lastTap = { id: null, t: 0 };
        $("q").value = 'near:"' + drag.node.name + '"~2';
        submitQuery();
      } else {
        lastTap = { id, t: now };
        select(id, false);
      }
    }
  } else if (drag.pan && tap && S.sel) {
    S.sel = null; S.armPath = false; renderInspect(); renderPeek(); redraw();
  }
  drag = null; memoPositions();
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("pointerleave", () => { if (S.hover) { S.hover = null; redraw(); } });
cv.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
  const w = toWorld(sx, sy);
  const f = Math.exp(-ev.deltaY * 0.0016);
  S.k = Math.max(0.12, Math.min(4.5, S.k * f));
  S.tx = sx - w.x * S.k; S.ty = sy - w.y * S.k;
  redraw();
}, { passive: false });
const zoomBy = (f) => { const w = toWorld(W / 2, H / 2); S.k = Math.max(0.12, Math.min(4.5, S.k * f)); S.tx = W / 2 - w.x * S.k; S.ty = H / 2 - w.y * S.k; redraw(); };
$("zIn").onclick = () => zoomBy(1.3);
$("zOut").onclick = () => zoomBy(1 / 1.3);
$("zFit").onclick = () => fit(null);
$("shuffle").onclick = () => { for (const n of nodes) { n.pin = false; n.vx += (Math.random() - .5) * 26; n.vy += (Math.random() - .5) * 26; } reheat(0.95); };
$("pathclose").onclick = () => { S.path = null; S.matched = null; $("q").value = ""; $("qcount").textContent = ""; $("qcount").classList.remove("on"); renderResults(); refresh(false); };

/* ============================================================ 13. CONTROLS */
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") submitQuery(); });
$("q").addEventListener("input", () => { if (!$("q").value.trim()) { S.matched = null; S.path = null; $("qcount").textContent = ""; $("qcount").classList.remove("on"); renderResults(); refresh(false); } });
$("dimBtn").onclick = () => { S.dim = !S.dim; $("dimBtn").setAttribute("aria-pressed", String(S.dim)); $("dimBtn").textContent = S.dim ? "Dim" : "Hide"; refresh(true); };
for (const [id, key] of [["hideOrphans", "hideOrphans"], ["showLabels", "showLabels"], ["freeze", "freeze"]]) {
  $(id).onchange = (e) => { S[key] = e.target.checked; if (key === "freeze" && !S.freeze) reheat(0.3); refresh(key !== "showLabels"); };
}
$("keepUndated").onchange = (e) => { S.keepUndated = e.target.checked; refresh(true); };
function yrSync() {
  const a = +$("yrFrom").value, b = +$("yrTo").value;
  S.yFrom = Math.min(a, b); S.yTo = Math.max(a, b);
  $("yrFromLbl").textContent = S.yFrom <= SMIN ? "earliest" : S.yFrom;
  $("yrToLbl").textContent = S.yTo >= SMAX ? "latest" : S.yTo;
  refresh(true);
}
$("yrFrom").oninput = yrSync; $("yrTo").oninput = yrSync;
document.querySelectorAll("[data-all]").forEach(b => {
  b.onclick = () => {
    if (b.dataset.all === "types") { const full = S.types.size === TYPES.length; S.types = new Set(full ? [] : TYPES.map(t => t[0])); }
    else { const full = S.rels.size === REL_KEYS.length; S.rels = new Set(full ? [] : REL_KEYS); }
    refresh(true);
  };
});
function showPane(id, open) {
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === id));
  document.querySelectorAll('[role="tab"]').forEach(t => t.setAttribute("aria-selected", String(t.dataset.pane === id)));
  if (open) openRail("railR");
}
function openRail(which) {
  const narrow = window.innerWidth <= 1080;
  $("railL").classList.toggle("open", which === "railL");
  $("railR").classList.toggle("open", which === "railR");
  $("scrim").classList.toggle("on", narrow && !!which);
}
const closeRails = () => openRail(null);
document.querySelectorAll('[role="tab"]').forEach(t => { t.onclick = () => showPane(t.dataset.pane, true); });
$("drawerL").onclick = () => openRail($("railL").classList.contains("open") ? null : "railL");
$("drawerR").onclick = () => openRail($("railR").classList.contains("open") ? null : "railR");
$("scrim").onclick = closeRails;
$("sheetClose").onclick = closeRails;
$("peek").onclick = () => showPane("paneInspect", true);
$("moodBtn").onclick = () => {
  const sunset = document.documentElement.getAttribute("data-mood") === "sunset";
  document.documentElement.setAttribute("data-mood", sunset ? "night" : "sunset");
  $("moodBtn").textContent = sunset ? "Mood: Night" : "Mood: Sunset";
  readColors(); redraw();
};
const LONG_PLACEHOLDER = $("q").placeholder;
function syncPlaceholder() {
  $("q").placeholder = window.innerWidth < 760
    ? 'Search, or query:  type:album  near:"Sound City"~2'
    : LONG_PLACEHOLDER;
}
addEventListener("resize", () => {
  if (window.innerWidth > 1080) $("scrim").classList.remove("on");
  syncPlaceholder();
  const prev = W;
  resize();
  renderPeek();
  if (Math.abs(W - prev) > 80) fit(S.matched && S.matched.size ? S.matched : null);
});

/* ============================================================ 14. EDITING + STORE */
function say(id, msg, cls) { const p = $(id); p.textContent = msg; p.className = "say" + (cls ? " " + cls : ""); }
const newId = () => "u." + Date.now().toString(36) + "." + Math.random().toString(36).slice(2, 6);

async function writeNode(id, body) {
  OV_NODES.set(id, body); rebuild();
  if (!db) return false;
  try { await db.collection("graph_nodes").doc(id).set(body); return true; }
  catch (e) { say("sayNode", "Not saved: " + (e && e.code ? e.code : "store error"), "bad"); return false; }
}
async function writeEdge(id, body) {
  OV_EDGES.set(id, body); rebuild();
  if (!db) return false;
  try { await db.collection("graph_edges").doc(id).set(body); return true; }
  catch (e) { say("sayEdge", "Not saved: " + (e && e.code ? e.code : "store error"), "bad"); return false; }
}
function rebuild() { memoPositions(); buildGraph(); applyFilters(); renderFilters(); renderMine(); renderInspect(); renderStat(); reheat(0.45); }

$("addNode").onclick = async () => {
  const name = $("nName").value.trim();
  if (!name) return say("sayNode", "Give it a name first.", "bad");
  const id = newId();
  const body = { id, type: $("nType").value, name, year: $("nYear").value ? +$("nYear").value : null, note: $("nNote").value.trim() || null };
  const saved = await writeNode(id, body);
  $("nName").value = ""; $("nYear").value = ""; $("nNote").value = "";
  say("sayNode", saved ? "Added " + name + " — saved for everyone." : "Added " + name + " — this browser only, not stored.", saved ? "ok" : "");
  select(id, true);
};
$("addEdge").onclick = async () => {
  const a = findByName($("eFrom").value.trim()), b = findByName($("eTo").value.trim());
  if (!a || !b) return say("sayEdge", "Both ends must be entities that exist.", "bad");
  if (a.id === b.id) return say("sayEdge", "That connects a thing to itself.", "bad");
  const rel = $("eRel").value;
  const id = edgeKey(a.id, b.id, rel);
  const body = { id, f: a.id, t: b.id, rel, year: $("eYear").value ? +$("eYear").value : null, note: $("eNote").value.trim() || null };
  const saved = await writeEdge(id, body);
  $("eNote").value = "";
  say("sayEdge", a.name + " " + RELS[rel].label + " " + b.name + (saved ? " — saved." : " — this browser only."), saved ? "ok" : "");
  select(a.id, false);
};
async function removeNode(id) {
  const n = byId.get(id); if (!n) return;
  await writeNode(id, { id, deleted: true, name: n.name, type: n.type });
  S.sel = null; renderInspect();
}
async function removeEdge(id) {
  const e = edges.find(x => x.id === id); if (!e) return;
  await writeEdge(id, { id, deleted: true, f: e.f, t: e.t, rel: e.rel });
}
function renderMine() {
  const box = $("mineList"); box.textContent = "";
  const mine = nodes.filter(n => n.own), me = edges.filter(e => e.own);
  if (!mine.length && !me.length) {
    const p = el("p", "say", "Nothing added yet. New entities carry a ring so you can spot them on the graph.");
    box.append(p); return;
  }
  for (const n of mine) {
    const b = el("button", "lk"); b.type = "button";
    b.append(dot(n.type), el("span", "nm", n.name), el("span", "yr", "edit"));
    b.onclick = () => select(n.id, true);
    box.append(b);
  }
  for (const e of me) {
    const b = el("button", "lk"); b.type = "button";
    const label = (byId.get(e.f) || {}).name + " " + RELS[e.rel].label + " " + (byId.get(e.t) || {}).name;
    b.append(dot("label"), el("span", "nm", label), el("span", "yr", "×"));
    b.onclick = () => removeEdge(e.id);
    box.append(b);
  }
}
$("exportBtn").onclick = async () => {
  const payload = JSON.stringify({
    generated: new Date().toISOString(),
    nodes: nodes.map(n => ({ id: n.id, type: n.type, name: n.name, year: n.year, note: n.note, added: n.own || undefined })),
    edges: edges.map(e => ({ from: e.f, to: e.t, rel: e.rel, year: e.year, note: e.note, added: e.own || undefined })),
  }, null, 1);
  if (downloads) {
    try { await downloads.save({ filename: "patchbay-graph.json", data: payload }); say("sayIO", "Saved.", "ok"); return; }
    catch (err) { if (err && err.code === "declined") return say("sayIO", "Save cancelled."); }
  }
  try { await navigator.clipboard.writeText(payload); say("sayIO", "Copied " + nodes.length + " entities and " + edges.length + " connections to the clipboard.", "ok"); }
  catch (err) { say("sayIO", "Couldn't export from this view.", "bad"); }
};

async function connectStore() {
  db = await (window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null));
  downloads = await (window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null));
  const box = $("storeState"), lbl = $("storeLbl");
  if (!db) { lbl.textContent = "Local view — additions live in this browser only"; return; }
  storeLive = true; box.classList.add("live"); lbl.textContent = "Shared store connected — edits are live for everyone";
  const bind = (coll, map) => db.collection(coll).onSnapshot((snap) => {
    map.clear();
    for (const d of snap.docs) { const v = d.data(); if (v) map.set(d.id, v); }
    rebuild();
  }, (e) => { box.classList.remove("live"); lbl.textContent = "Store disconnected (" + (e && e.code) + ")"; });
  bind("graph_nodes", OV_NODES);
  bind("graph_edges", OV_EDGES);
}

})();
