name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI runs exactly what a contributor runs locally.
      # No real Spotify credentials are needed; tests use the fake
      # Spotify server (P1-10).
      - name: Verify
        run: pnpm verify

      # Only Chromium: the panel ships on one browser, on one device, and
      # installing three would be two minutes spent proving nothing.
      - name: Install Chromium for the end-to-end suite
        run: pnpm exec playwright install --with-deps chromium

      # Runs against `dist/`, which `pnpm verify` just built. Every other suite
      # tests one seam with the rest faked — this is the only one that can see
      # the pieces failing to be assembled (P8-06).
      - name: End-to-end
        run: pnpm e2e

      - name: Upload end-to-end traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
