name: Deploy showcase to GitHub Pages

# Pages creates a `github-pages` environment whose deployment branch policy
# defaults to the default branch only, so a deploy from the feature branch is
# refused at job setup with no log. Triggering on main too means a merge
# deploys with no settings change; deploying from the feature branch needs the
# branch added under Settings > Environments > github-pages.
on:
  push:
    branches:
      - main
      - claude/spotify-touch-screen-interface-7hv8vm
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
